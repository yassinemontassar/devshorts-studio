  return Math.round(lerp(138, 112, p(t, 53, 56)));
}
function p99ms(t) {
  if (t < S[1]) return 3100;
  if (t < S[3]) return 40;
  if (t < S[4]) return lerp(40, 3100, inOutCubic(p(t, 21.5, 30)));

const D = document.getElementById("diagram");

}
// edges

});
const vEdge = el("path", { d: `M${QL.x} ${QL.y + QL.h / 2 + 2} L ${SN.x} ${NODE_TOP - 2}`, fill: "none", stroke: C.paper, "stroke-width": 2.5, "stroke-linecap": "round", opacity: .55 });
// invisible full routes for packets: client -> query layer -> storage node top
const routes = CL.map((c, i) => {
  const ey = QL.y + (i - 1) * 28;
  return el("path", { d: `M${c.x + 62} ${c.y} C ${c.x + 170} ${c.y}, ${QL.x - QL.w / 2 - 110} ${ey}, ${QL.x - QL.w / 2 - 2} ${ey} M${QL.x} ${QL.y + QL.h / 2 + 2} L ${SN.x} ${NODE_TOP - 2}`, fill: "none", stroke: "none" });
});

  fill: "none", stroke: C.alarm, "stroke-width": 2.5, "stroke-dasharray": "2 12", "stroke-linecap": "round", opacity: 0 }));

const BOXES = [], REQS = [], RESPS = [], REJECTS = [];

});

EV.sort((a, b) => a.t - b.t);
let Q = [];  // index 0 = front (oldest)

let FINAL = null;
for (const e of EV) {
  const t = e.t;
  if (e.type === "arr") {
    if (Q.length >= (e.cap || 8)) continue;
    const dur = e.retry || 0.7;
    if (!e.nodot) REQS.push({ t0: t - dur, t1: t, c: e.c, retry: !!e.retry });
    if (e.hook) {
      const b = newBox(t, { slot: 0, lift: -66, client: e.c });

      RESPS.push({ t0: 2.7, t1: 3.4, c: e.c });
      continue;
    }
    if (e.final) {
      const b = newBox(t, { slot: 0, lift: -66, client: e.c, fillOp: 1 });
      key(b, 74.7, { slot: 7 });
      FINAL = b; continue;
    }
    const b = newBox(t, { slot: 0, client: e.c });
    if (e.pulse) b.pulse = e.pulse;
    Q.push(b); key(b, t + 0.12, { slot: 7 - (Q.length - 1) });
  } else if (e.type === "srv") {
    if (!Q.length) continue;
    if (e.mode === "fifo") {
      const b = Q.shift();
      key(b, t, { slot: 7.7, op: 0 });
      RESPS.push({ t0: t + 0.15, t1: t + 0.85, c: b.kf[0].client });
      layout(t + 0.1);
    } else {
      const b = Q.pop();
      key(b, t, { lift: -66 }); key(b, t + 0.3, { slot: 7 }); key(b, t + 0.62, { slot: 7.7, op: 0 });
      RESPS.push({ t0: t + 0.7, t1: t + 1.4, c: b.kf[0].client });
    }
  } else if (e.type === "abandon") {
    Q.filter(b => b.kf[0].client === e.c).forEach(b => key(b, t, { col: C.muted, dash: true, fillOp: 0 }));
  } else if (e.type === "reject") {
    Q.forEach(b => { key(b, t, { col: C.alarm, fillOp: 0.25 }); key(b, t + 0.38, { op: 0 }); });
    REJECTS.push(t); Q = [];
  } else if (e.type === "clear") {
    Q.forEach(b => key(b, t, { op: 0 })); Q = [];
  }
}
// scene 8: whole queue turns amber; the newest box sits at the front
Q.forEach(b => key(b, 74.4, { col: C.signal, dash: false, fillOp: 0.22 }));
BOXES.forEach(b => b.kf.sort((a, c) => a.t - c.t));
const boxEls = BOXES.map(() => el("rect", { width: BOX, height: BOX, rx: 8, "stroke-width": 3 }, QG));
function boxState(b, t) {
  if (t < b.kf[0].t) return null;
  let cur = {}, prev = null, last = 0;
  for (let i = 0; i < b.kf.length && b.kf[i].t <= t; i++) { prev = { ...cur }; cur = { ...cur, ...b.kf[i] }; last = i; }
  if (last === 0) prev = { ...cur, op: 0 };
  const k = outCubic(p(t, b.kf[last].t, b.kf[last].t + MOVE));
  return {
    slot: lerp(prev.slot, cur.slot, k), lift: lerp(prev.lift, cur.lift, k), op: lerp(prev.op, cur.op, last === 0 ? p(t, b.kf[0].t, b.kf[0].t + 0.2) : k),
    col: mix(prev.col, cur.col, k), fillOp: lerp(prev.fillOp, cur.fillOp, k), dash: cur.dash,
  };
}

// ---------- packets ----------
const PK = document.getElementById("packets");
const pool = []; const dot = i => { while (pool.length <= i) pool.push(el("circle", { r: 6 }, PK)); return pool[i]; };
const routeLen = routes.map(r => r.getTotalLength()), retryLen = retryPaths.map(r => r.getTotalLength());

// ---------- HTML text layers ----------
const titlesEl = document.getElementById("titles"), capsEl = document.getElementById("captions");
const titleNodes = TITLES.map(([a, b, s]) => { const d = document.createElement("div"); d.className = "title"; d.textContent = s; titlesEl.appendChild(d); return d; });
const capNodes = CAPTIONS.map(([a, b, s]) => { const d = document.createElement("div"); d.className = "caption"; d.textContent = s; capsEl.appendChild(d); return d; });
const clockEl = document.getElementById("clock"), endEl = document.getElementById("endcard");

function setDraw(e, len, k) { e.setAttribute("stroke-dasharray", `${len} ${len}`); e.setAttribute("stroke-dashoffset", len * (1 - k)); }
const edgeLens = new Map(); [...edgePaths, vEdge].forEach(e => edgeLens.set(e, e.getTotalLength()));
const fmtMs = v => v < 1000 ? `${Math.round(v)} ms` : `${(v / 1000).toFixed(1)} s`;

// ---------- render(t): everything on screen is a function of t ----------
function render(t) {
  const A = diagramAlpha(t), dim = dimK(t);
  D.setAttribute("opacity", A * dim);
  PK.setAttribute("opacity", A * dim);
  notes.setAttribute("opacity", A * dim);
  QG.setAttribute("opacity", A);

  // pen-draw (scene 2), already drawn in the hook
  clients.forEach((c, i) => {
    const k = drawP(t, 4.8 + i * 0.1);
    setDraw(c.r, c.len, k); c.r.setAttribute("fill-opacity", drawP(t, 5.2));
    const dead = clientDead(i, t);
    c.r.setAttribute("stroke", dead ? C.muted : C.paper);
    if (dead) { c.r.setAttribute("stroke-dasharray", "10 10"); c.r.removeAttribute("stroke-dashoffset"); }
    const f = timerFrac(i, t), circ = 2 * Math.PI * 14;
    const tc = dead ? C.muted : f < 0.35 ? C.alarm : C.paper;
    c.ring.setAttribute("stroke-dasharray", `${circ * f} ${circ}`); c.ring.setAttribute("stroke", tc);
    const ang = (1 - f) * 2 * Math.PI;
    c.hand.setAttribute("x2", CL[i].x + 26 + 8 * Math.sin(ang)); c.hand.setAttribute("y2", CL[i].y - 8 * Math.cos(ang)); c.hand.setAttribute("stroke", tc);
    [c.lab, c.ring, c.ringBg, c.hand].forEach(e => e.setAttribute("opacity", drawP(t, 5.0 + i * 0.1, 0.4)));
    c.lab.setAttribute("fill", dead ? C.muted : C.paper);
  });
  clientsLabel.setAttribute("opacity", drawP(t, 4.9));
  edgePaths.forEach((e, i) => setDraw(e, edgeLens.get(e), drawP(t, 5.1 + i * 0.06)));
  setDraw(qlN.r, qlN.len, drawP(t, 5.25)); qlN.r.setAttribute("fill-opacity", drawP(t, 5.6));
  [qlT, qlS, qlG].forEach(e => e.setAttribute("opacity", drawP(t, 5.6, 0.4)));
  setDraw(vEdge, edgeLens.get(vEdge), drawP(t, 5.45));
  setDraw(snN.r, snN.len, drawP(t, 5.6, 0.9)); snN.r.setAttribute("fill-opacity", drawP(t, 6.0));
  [snT, gDb, snIn, snP99, meterBg, meter].forEach(e => e.setAttribute("opacity", drawP(t, 6.0, 0.4)));

  // node sub line
  let sub = "", subA = 0;
  if (t >= 5.9 && t < S[2]) { sub = "Docstore · Schemaless"; subA = p(t, 5.9, 6.3) * (1 - p(t, 15.0, 15.28)); }
  if (t >= 35.9 && t < S[5]) { sub = "earlier version: fixed wait"; subA = p(t, 35.9, 36.3) * (1 - p(t, 45.1, 45.37)); }
  snSub.textContent = sub; snSub.setAttribute("opacity", subA);

  // in-flight meter + p99
  const v = inflight(t), amb = p(v, 40, 100), red = p(v, 145, 160);
  const mcol = mix(mix(C.paper, C.signal, amb), C.alarm, red);
  meter.setAttribute("width", Math.max(10, (SN.w - 60) * Math.min(1, v / 175)));
  meter.setAttribute("fill", mcol);
  snIn.textContent = `in‑flight ${v}`; snIn.setAttribute("fill", red > 0.5 ? C.alarm : amb > 0.5 ? C.signal : C.muted);
  const lat = p99ms(t);
  snP99.textContent = `p99 ${fmtMs(lat)}`; snP99.setAttribute("fill", lat > 2000 ? C.alarm : C.muted);
  const pulse = red > 0.6 ? 0.5 + 0.5 * Math.sin(t * 9) : 0;
  const emph = p(t, 74.3, 75.0);
  snN.r.setAttribute("stroke", mix(C.paper, C.alarm, red * (0.55 + 0.45 * pulse)));

  // order arrow (scene 3 on), flips at 50.6
  const arA = t < S[1] ? 0 : drawP(t, 15.6, 0.6);
  const flip = outCubic(p(t, 50.6, 51.1));
  arrowG.setAttribute("opacity", arA); orderLab.setAttribute("opacity", arA * (flip > 0 && flip < 1 ? Math.abs(1 - 2 * flip) : 1));
  arrowG.setAttribute("transform", `rotate(${180 * flip} 600 ${AY})`);
  const lifo = flip >= 0.5;
  orderLab.textContent = lifo ? "LIFO under pressure" : "FIFO";
  orderLab.setAttribute("fill", lifo ? C.signal : C.paper);
  arrowLine.setAttribute("stroke", lifo ? C.signal : C.paper);
  [backLab, frontLab].forEach(e => e.setAttribute("opacity", arA));

  // queue boxes
  BOXES.forEach((b, i) => {
    const s = boxState(b, t), e = boxEls[i];
    if (!s || s.op <= 0.001) { e.setAttribute("opacity", 0); return; }
    let shake = 0;
    for (const r of REJECTS) if (t >= r && t < r + 0.35) shake = Math.sin((t - r) * 70) * 8 * (1 - p(t, r, r + 0.35));
    let sw = 3;
    if (b.pulse && t >= b.pulse[0] && t < b.pulse[1]) sw = 3 + 2.5 * (0.5 + 0.5 * Math.sin((t - b.pulse[0]) * 7));
    e.setAttribute("x", slotX(s.slot) + shake); e.setAttribute("y", QY + s.lift);
    e.setAttribute("stroke", s.col); e.setAttribute("fill", s.col); e.setAttribute("fill-opacity", s.fillOp);
    e.setAttribute("stroke-width", sw);
    if (s.dash) e.setAttribute("stroke-dasharray", "8 7"); else e.removeAttribute("stroke-dasharray");
    e.setAttribute("opacity", s.op);
  });

  // retry arcs visible while retries fly
  retryPaths.forEach((pa, i) => {
    let a = 0;
    for (const r of REQS) if (r.retry && r.c === i && t >= r.t0 - 0.15 && t <= r.t1 + 0.35) a = 0.9;
    pa.setAttribute("opacity", a);
  });

  // packets
  let n = 0;
  for (const r of REQS) {
    if (t < r.t0 || t > r.t1) continue;
    const k = inOutCubic(p(t, r.t0, r.t1));
    const path = r.retry ? retryPaths[r.c] : routes[r.c], len = r.retry ? retryLen[r.c] : routeLen[r.c];
    const pt = path.getPointAtLength(len * k), c = dot(n++);
    c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.setAttribute("r", 8);
    c.setAttribute("fill", r.retry ? C.alarm : C.signal);
    c.setAttribute("opacity", Math.min(1, (t - r.t0) / 0.08, (r.t1 - t) / 0.08 + 0.3));
  }
  for (const r of RESPS) {
    if (t < r.t0 || t > r.t1) continue;
    const k = 1 - inOutCubic(p(t, r.t0, r.t1));
    const pt = routes[r.c].getPointAtLength(routeLen[r.c] * k), c = dot(n++);
    c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.setAttribute("r", 5.5);
    c.setAttribute("fill", C.paper);
    const dead = clientDead(r.c, r.t1);
    c.setAttribute("opacity", Math.min(1, (t - r.t0) / 0.08) * (dead ? 1 - p(t, lerp(r.t0, r.t1, 0.55), r.t1) : 1));
  }
  for (let i = n; i < pool.length; i++) pool[i].setAttribute("opacity", 0);

  // rejection ring + 429s
  let rk = 0;
  for (const r of REJECTS) if (t >= r && t < r + 0.8) rk = p(t, r, r + 0.8);
  ring.setAttribute("rx", lerp(300, 350, outCubic(rk))); ring.setAttribute("ry", lerp(50, 90, outCubic(rk)));
  ring.setAttribute("opacity", rk > 0 && rk < 1 ? (1 - rk) * 0.9 : 0);
  let bI = 0;
  for (const r of REJECTS) for (let i = 0; i < 3; i++) {
    const age = t - r - i * 0.05; const e = badges[bI++];
    if (age < 0 || age > 1.1) { e.setAttribute("opacity", 0); continue; }
    e.setAttribute("x", CL[i].x + 72); e.setAttribute("y", CL[i].y - 6 - 50 * outCubic(age / 1.1));
    e.setAttribute("opacity", Math.min(1, age / 0.12) * (1 - p(age, 0.7, 1.1)));
  }
  for (let i = bI; i < badges.length; i++) badges[i].setAttribute("opacity", 0);

  // markers (scene 6, fade at the takeaway)
  const off = 1 - p(t, 74.2, 74.6);
  const f1 = p(t, 50.2, 50.6) * off, f2 = p(t, 55.6, 56.1) * off;
  mFlip.setAttribute("opacity", f1);
  mMeas.setAttribute("opacity", f2); lMeas.setAttribute("opacity", f2);
  lMeas.setAttribute("transform", `translate(${(1 - outCubic(p(t, 55.6, 56.1))) * 20} 0)`);
  lForm.setAttribute("opacity", p(t, 58.0, 58.5) * off);

  // below the diagram
  scaleLine.setAttribute("opacity", p(t, 7.66, 8.1) * (1 - p(t, 14.9, 15.28)));
  const r1 = p(t, 67.4, 67.9), r2 = p(t, 70.75, 71.25), rOff = 1 - p(t, 73.9, 74.2);
  row1.setAttribute("opacity", r1 * rOff); row1.setAttribute("transform", `translate(${(1 - outCubic(r1)) * 24} 0)`);
  row2.setAttribute("opacity", r2 * rOff); row2.setAttribute("transform", `translate(${(1 - outCubic(r2)) * 24} 0)`);
  srcLine.textContent = inScene(t, 6) ? SOURCE_S7 : SOURCE;
  const srcSwap = (t > 61.3 && t < 61.75) ? Math.abs(p(t, 61.3, 61.75) * 2 - 1) : (t > 73.95 && t < 74.4) ? Math.abs(p(t, 73.95, 74.4) * 2 - 1) : 1;
  srcLine.setAttribute("opacity", (t < 4.4 ? p(t, 0, 0.2) : p(t, 6.2, 6.6)) * (1 - p(t, VOICE_END - 0.2, VOICE_END + 0.2)) * srcSwap * (t >= S[1] && t < 4.8 ? 1 - p(t, S[1], 4.7) : 1));

  // rewind scan into scene 2
  const sk = p(t, S[1], 4.95), scan = document.getElementById("scan");
  scan.setAttribute("y", lerp(1920, -10, inOutCubic(sk))); scan.setAttribute("opacity", sk > 0 && sk < 1 ? 0.9 : 0);

  // series label
  clockEl.style.opacity = p(t, 0, 0.2) * (1 - p(t, VOICE_END - 0.2, VOICE_END + 0.2));

  // titles: slide up + fade in, quick fade out
  TITLES.forEach(([a, b2], i) => {
    const k = outQuint(p(t, a, a + 0.55)), out = 1 - p(t, b2 - 0.25, b2);
    titleNodes[i].style.opacity = k * out;
    titleNodes[i].style.transform = `translateY(${(1 - k) * 34}px)`;
    titleNodes[i].style.display = (t >= a && t <= b2) ? "block" : "none";
  });
  CAPTIONS.forEach(([a, b2], i) => {
    const vis = t >= a && t <= b2;
    capNodes[i].style.display = vis ? "block" : "none";
    capNodes[i].style.opacity = p(t, a, a + 0.14) * (1 - p(t, b2 - 0.12, b2));
  });
  // end card
  const ek = outQuint(p(t, VOICE_END + 0.35, VOICE_END + 0.95));
  endEl.style.opacity = ek; endEl.style.transform = `translateY(${(1 - ek) * 30}px)`;
}
window.render = render;
window.DURATION = DURATION;
render(0);
</script>
