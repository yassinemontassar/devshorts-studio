<script>
// =====================================================================================
// DS-001 (the reference episode). Every frame is a pure function of t: window.render(t).
// The queue is simulated once at load (deterministic), then looked up per frame.
//
// THIS IS THE TEMPLATE ("blueprint v2" motion system). For a new episode, copy this folder's
// index.html and:
//   KEEP as is:   CSS, helpers, timing helpers W()/SC/WORDS, sfx(), camera (fr/cam/camera),
//                 headlines (big for 2.4 s, then settle small), karaoke captions, big numbers,
//                 scale overlay, source line, end card, fade backdrops, flash, screen shake.
//   REPLACE:      DURATION, the layout block, the story events + "story, beat by beat" block,
//                 the simulation/drawing of the system's parts, camera keyframes, HEADS,
//                 SOURCE text, #scale / #big1 / #big2 text, end-card "Next: ..." line.
// Rules: every visual change lands on a spoken word via W(scene, "word"); objects live in
// world coordinates and the camera frames the band you are talking about (fr(t, top, bottom));
// one change per beat; every story event that matters gets an sfx() so tools/sound.py hears it.
// =====================================================================================
const DURATION = 82.3, FPS_SIM = 60, DT = 1 / FPS_SIM;
const C = { paper: "#E8F0F7", muted: "#8FA9C2", signal: "#FFC247", alarm: "#FF5D47", mint: "#7FE3B8", node: "#13385B", ink: "#10304F" };
const NS = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outQ = k => 1 - Math.pow(1 - k, 5);
const outB = k => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function mix(c1, c2, k) { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const a = h(c1), b = h(c2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k))).toString(16).padStart(2, "0")).join(""); }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- channel handles: the end card is rendered once per platform (render.py endcards) ----------
const CHANNEL = {
  tiktok:    { h: "@yassine.montassar4",  m: "Source in the pinned comment" },
  instagram: { h: "@yassine.montassar99", m: "Source in the pinned comment" },
  youtube:   { h: "@YassineMontassar",    m: "Source in the description" },
  linkedin:  { h: "Yassine Montassar",    m: "Source in the first comment" },
};
const PLATFORM = CHANNEL[new URLSearchParams(location.search).get("p")] ? new URLSearchParams(location.search).get("p") : "tiktok";

// ---------- timing helpers (from the voiceover) ----------
const TM = window.TIMING, SC = TM.scenes.map(s => s.start);
SC[0] = 0;
const SC_END = TM.scenes.map(s => s.end);
const VOICE_END = TM.duration;
const WORDS = []; TM.phrases.forEach((ph, i) => ph.words.forEach(w => WORDS.push({ ...w, scene: ph.scene, phrase: i })));
function W(scene, word, nth = 0) {           // start time of the nth word in a scene that starts with `word`
  const m = WORDS.filter(x => x.scene === scene && x.w.toLowerCase().replace(/[^a-z0-9%-]/g, "").startsWith(word.toLowerCase()));
  if (!m.length) throw new Error("word not found: " + scene + " " + word);
  return m[Math.min(nth, m.length - 1)].t0;
}

// ---------- layout (world coordinates) ----------
const PHONES = [{ x: 300, y: 455 }, { x: 515, y: 455 }, { x: 730, y: 455 }];
const QX = 470, FRONT_Y = 1040, PITCH = 66, CARD_W = 500, CARD_H = 58, LANE_X = 860;
const SERVER = { x: 515, y: 1140, w: 720, h: 112 };
const RET_X = 118, RET_TOP = 372;
const slotY = i => FRONT_Y - i * PITCH;
const TIMEOUT = 5.0;

// ---------- story events → simulation ----------
const EV = [];                     // {t, fn}
const SFX = [];                    // {t, kind, gain}
const on = (t, fn) => EV.push({ t, fn });
const sfx = (t, kind, gain = 1) => SFX.push({ t: +t.toFixed(3), kind, gain });

let cardSeq = 1040;
const cards = [];                  // all cards ever created
let queue = [];                    // ids, index 0 = front (next to the server in FIFO)
let policy = "FIFO";
const responses = [];              // {t0, x0, y0, client, ok}
function mkCard(t, client, born, opts = {}) {
  const c = { id: cards.length, n: cardSeq++, client, born, x: PHONES[client].x, y: PHONES[client].y + 40, vx: 0, vy: 0,
    state: "queue", t0: t, op: 0, retry: !!opts.retry, fresh: !!opts.fresh, path: null, tEnd: null, red: 0, wasStale: false, glow: !!opts.glow };
  cards.push(c); return c;
}
function fill(t, ages) {           // ages listed front → back
  on(t, T => { ages.forEach((a, i) => { const c = mkCard(T, i % 3, T - a); c.x = QX; c.y = slotY(i); c.op = 1; queue.push(c.id); }); });
}
function arrive(t, client, opts = {}) { on(t, T => { if (queue.length >= 8) return; const c = mkCard(T, client, T, opts); queue.push(c.id); sfx(T, "tick", .8); }); }
function serve(t) {
  on(t, T => {
    if (!queue.length) return;
    const idx = policy === "FIFO" ? 0 : queue.length - 1;
    const id = queue.splice(idx, 1)[0], c = cards[id];
    c.state = "toServer"; c.tS = T;
    c.path = idx === 0 ? [[QX, SERVER.y - 10]] : [[LANE_X, c.y], [LANE_X, SERVER.y - 60], [SERVER.x + 200, SERVER.y - 10]];
    const stale = (T - c.born) > TIMEOUT;
    const tR = T + (idx === 0 ? .42 : .78);
    responses.push({ t0: tR, client: c.client, ok: !stale });
    c.wasStale = stale;
  });
}
function rejectAll(t) { on(t, T => { queue.forEach(id => { const c = cards[id]; c.state = "rejected"; c.tS = T; }); queue = []; }); sfx(t, "reject", 1); }
function burst(t, n) { for (let i = 0; i < n; i++) arrive(t + i * .028, i % 3, { retry: true }); }
function clearAll(t) { on(t, T => { queue.forEach(id => { const c = cards[id]; c.state = "fade"; c.tS = T; }); queue = []; }); }
const setPolicy = (t, pol) => on(t, () => { policy = pol; });

// ---------- the story, beat by beat (times come from the spoken words) ----------
const S = SC;
// Scene 1, hook: a full, stale queue. The newest request jumps the line.
fill(0, [9.8, 8.6, 7.1, 5.9, 4.4, 2.6, 1.2]);
sfx(0.02, "boom", 1);
const tNewest = W(0, "newest"), tFirst = W(0, "first");
setPolicy(tNewest - .05, "LIFO");
arrive(tNewest, 1, { fresh: true, glow: true });
serve(tFirst + .1); sfx(tFirst + .1, "whoosh", .7); sfx(tFirst + .9, "chime", .7);
clearAll(SC_END[0] + .25);
// Scene 2: scale. Camera pulls out over the fleet; the queue idles in normal FIFO.
setPolicy(S[1], "FIFO");
sfx(S[1] + .05, "whoosh", 1);
for (let t = S[1] + .5; t < S[2] - .6; t += 1.15) { arrive(t, Math.floor(rnd() * 3)); serve(t + .9); }
sfx(W(1, "keeping"), "whoosh", .8);
// Scene 3: normal FIFO. Short queue, everything answered.
for (let t = S[2] + .2, k = 0; t < S[3] - .5; t += .85, k++) { arrive(t, k % 3); serve(t + .62); }
// Scene 4: overload. Arrivals outrun service; the front goes stale; answers go nowhere.
setPolicy(S[3], "FIFO");
{
  const tGave = W(3, "gave"), tRetried = W(3, "retried"), tDb = W(3, "database"), tFresh = W(3, "fresh");
  let t = S[3] + .1, k = 0;
  while (t < tGave) { arrive(t, k % 3); t += .42; k++; }                     // fill up fast
  for (let s = S[3] + 1.6; s < tDb; s += 1.9) serve(s);                     // slow service
  arrive(tRetried - .2, 0, { retry: true }); arrive(tRetried + .15, 2, { retry: true });
  for (let s = tDb + .2; s < tFresh; s += 1.05) { serve(s); arrive(s + .5, (k++) % 3); }   // serving stale answers
  arrive(tFresh + .1, 1, { fresh: true, glow: true });
  for (let s = tFresh + 1.2; s < S[4] - .4; s += 1.4) { serve(s); arrive(s + .55, (k++) % 3); }
}
// Scene 5: the earlier trap, synchronized retries.
{
  const tRej = W(4, "rejected"), tAll = W(4, "all"), tOver = W(4, "overload"), tRej2 = W(4, "rejection"), tRep = W(4, "repeat");
  rejectAll(tRej); burst(tAll + .25, 7);
  on(tOver - .02, () => {}); sfx(tOver, "thud", .9);
  rejectAll(tRej2); burst(tRep, 7);
  clearAll(S[5] - .2);
}
// Scene 6: adapt. FIFO at normal load, flip to LIFO under pressure, in-flight on the node.
{
  setPolicy(S[5], "FIFO");
  const tNormal = W(5, "normal"), tPressure = W(5, "pressure"), tFlips = W(5, "flips"), tFav = W(5, "favoring"), tLoad = W(5, "load", 1);
  arrive(S[5] + .3, 0); arrive(S[5] + .9, 1); serve(tNormal + .1); arrive(tNormal + .6, 2); serve(tNormal + 1.1);
  for (let i = 0; i < 7; i++) arrive(tPressure + i * .16, i % 3);
  setPolicy(tFlips + .25, "LIFO"); sfx(tFlips + .25, "flip", 1);
  for (let s = tFav - .3, k = 0; s < tLoad + .4; s += 1.05, k++) { serve(s); arrive(s + .45, k % 3); }
  for (let s = tLoad + 1.4, k = 1; s < S[6] - .6; s += 1.25, k++) { serve(s); arrive(s + .5, k % 3); }
}
// Scene 7: the rule and the numbers (queue keeps running quietly in LIFO).
for (let s = S[6] + .4, k = 0; s < S[7] - .6; s += 1.2, k++) { arrive(s, k % 3); serve(s + .7); }
sfx(W(6, "eighty") - .1, "chime", 1); sfx(W(6, "seventy") - .1, "chime", .9);
// Scene 8: takeaway, then end card.
fill(S[7] - .01, []);
sfx(VOICE_END + .15, "end", .9);

// ---------- run the simulation once, record per-frame snapshots ----------
EV.sort((a, b) => a.t - b.t);
const NF = Math.ceil(DURATION * FPS_SIM) + 2;
const FR = new Array(NF);
{
  let e = 0;
  for (let f = 0; f < NF; f++) {
    const T = f * DT;
    while (e < EV.length && EV[e].t <= T + 1e-9) { EV[e].fn(EV[e].t); e++; }
    queue.forEach((id, i) => { const c = cards[id]; c.tx = QX; c.ty = slotY(i); });
    const snap = [];
    for (const c of cards) {
      if (c.state === "gone") continue;
      if (c.state === "toServer") {
        const wp = c.path[0];
        c.tx = wp[0]; c.ty = wp[1];
        if (Math.hypot(c.x - wp[0], c.y - wp[1]) < 26 && c.path.length > 1) c.path.shift();
        if (c.path.length === 1 && Math.hypot(c.x - wp[0], c.y - wp[1]) < 22) { c.state = "served"; c.tS = T; }
      }
      if (c.state === "rejected" && T - c.tS > .32) { c.state = "leaving"; c.tS = T; c.tx = PHONES[c.client].x; c.ty = PHONES[c.client].y + 30; }
      const k = c.state === "toServer" ? 520 : c.state === "leaving" ? 260 : 200, d = 2 * Math.sqrt(k) * (c.state === "queue" ? .9 : 1);
      c.vx += (k * (c.tx - c.x) - d * c.vx) * DT; c.vy += (k * (c.ty - c.y) - d * c.vy) * DT;
      c.x += c.vx * DT; c.y += c.vy * DT;
      let op = c.state === "queue" ? clamp((T - c.t0) / .18) : 1;
      if (c.state === "served") { op = 1 - clamp((T - c.tS) / .22); if (op <= 0) { c.state = "gone"; continue; } }
      if (c.state === "leaving") { op = 1 - clamp((T - c.tS) / .32); if (op <= 0) { c.state = "gone"; continue; } }
      if (c.state === "fade") { op = 1 - clamp((T - c.tS) / .3); if (op <= 0) { c.state = "gone"; continue; } }
      snap.push([c.id, c.x, c.y, op, c.state === "rejected" || c.state === "leaving" ? 1 : 0, c.state === "served" ? 1 : 0, c.state === "toServer" ? 1 : 0]);
    }
    FR[f] = snap;
  }
}
// serve SFX from the simulated responses
responses.forEach(r => sfx(r.t0, r.ok ? "blip" : "thud", r.ok ? .7 : .6));
window.SFX = SFX.sort((a, b) => a.t - b.t);
window.DURATION = DURATION;

// ---------- static world drawing ----------
const $ = id => document.getElementById(id);
const world = $("world"), gNodes = $("nodes"), gCards = $("cards"), gFx = $("fx"), gNotes = $("notes"), gGrid = $("grid"), gLane = $("lane");
// fleet grid (scene 2)
const tiles = [];
for (let i = -15; i <= 15; i++) for (let j = -13; j <= 13; j++) {
  const x = 515 + i * 170, y = 840 + j * 130;
  if (Math.abs(x - 515) < 470 && Math.abs(y - 840) < 470) continue;
  const g = el("g", { opacity: 0 }, gGrid);
  el("rect", { x: x - 66, y: y - 34, width: 132, height: 68, rx: 12, fill: C.node, stroke: C.paper, "stroke-width": 5, "stroke-opacity": .55 }, g);
  const d = el("circle", { cx: x - 30, cy: y, r: 9, fill: C.signal }, g);
  tiles.push({ g, d, x, y, dist: Math.hypot(i, j), ph: rnd() });
}
// phones
const phones = PHONES.map((ph, i) => {
  const g = el("g", {}, gNodes);
  const r = el("rect", { x: ph.x - 38, y: ph.y - 64, width: 76, height: 128, rx: 16, fill: C.node, stroke: C.paper, "stroke-width": 3.5 }, g);
  el("line", { x1: ph.x - 12, y1: ph.y + 48, x2: ph.x + 12, y2: ph.y + 48, stroke: C.paper, "stroke-width": 3.5, "stroke-linecap": "round" }, g);
  const lbl = el("text", { x: ph.x, y: ph.y + 10, "text-anchor": "middle", fill: C.muted, "font-family": "Plex Mono", "font-weight": 600, "font-size": 30 }, g); lbl.textContent = "abc"[i];
  const ring = el("circle", { cx: ph.x, cy: ph.y, r: 58, fill: "none", stroke: C.mint, "stroke-width": 5, opacity: 0 }, g);
  const x = el("text", { x: ph.x + 46, y: ph.y - 34, fill: C.alarm, "font-family": "Plex Mono", "font-weight": 600, "font-size": 40, opacity: 0 }, g); x.textContent = "✕";
  const gone = el("text", { x: ph.x, y: ph.y + 104, "text-anchor": "middle", fill: C.muted, "font-family": "Plex Mono", "font-weight": 600, "font-size": 26, opacity: 0 }, g); gone.textContent = "gave up";
  return { g, r, lbl, ring, x, gone };
});
// response lane: answers travel back up the left side, never across the queue
const retPaths = PHONES.map(ph => el("path", { d: `M${SERVER.x - SERVER.w / 2 + 10} ${SERVER.y} L${RET_X} ${SERVER.y - 40} L${RET_X} ${RET_TOP} L${ph.x} ${RET_TOP} L${ph.x} ${ph.y - 66}`, fill: "none", stroke: "none" }, gLane));
const retLane = el("path", { d: `M${SERVER.x - SERVER.w / 2 + 10} ${SERVER.y} L${RET_X} ${SERVER.y - 40} L${RET_X} ${RET_TOP} L${PHONES[2].x} ${RET_TOP}`, fill: "none", stroke: C.muted, "stroke-width": 2.5, "stroke-dasharray": "3 12", "stroke-linecap": "round", opacity: .45 }, gLane);
const retLens = retPaths.map(pa => pa.getTotalLength());
// server: name + policy pill on top, load meter, in-flight and p99 on the bottom row
const SX0 = SERVER.x - SERVER.w / 2, SX1 = SERVER.x + SERVER.w / 2, SY0 = SERVER.y - SERVER.h / 2;
